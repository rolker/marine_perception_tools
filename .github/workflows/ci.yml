# CI for marine_perception_tools. See ADR-0004/0005 (enforcement hierarchy)
# in the workspace repo for the rationale behind the build+test+lint gate.

name: CI

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ros:jazzy-ros-core

    steps:
      - name: Update apt
        run: apt-get update

      - name: Install ros dev tools
        run: DEBIAN_FRONTEND=noninteractive apt-get -y install ros-dev-tools

      - name: Checkout
        uses: actions/checkout@v6

      - name: Init rosdep
        run: |
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi

      - name: Update rosdep
        run: rosdep update

      - name: Create workspace
        run: mkdir -p ../ws/src && ln -s "$GITHUB_WORKSPACE" ../ws/src/marine_perception_tools

      # sea_surface_segmentation is a source sibling (not in rosdep): the tuner
      # reuses its exported header-only algorithm core. Clone it so the build
      # resolves. This pulls its heavier transitive deps (depthai, nav2, grid_map)
      # via rosdep below — the workspace `make build` is the primary integration
      # gate; this per-repo CI is the lighter-weight check.
      - name: Clone sea_surface_segmentation source dependency
        run: >
          git clone --depth 1 -b jazzy
          https://github.com/rolker/unh_marine_perception.git
          ../ws/src/unh_marine_perception

      - name: Install ROS dependencies
        working-directory: ../ws
        run: >
          DEBIAN_FRONTEND=noninteractive
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/jazzy/setup.bash &&
          colcon build --packages-up-to marine_perception_tools
          --cmake-args -DBUILD_TESTING=ON'

      - name: Test
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/jazzy/setup.bash &&
          source install/setup.bash &&
          colcon test --packages-select marine_perception_tools
          --event-handlers console_direct+
          --return-code-on-test-failure'

      - name: Test results
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/jazzy/setup.bash &&
          colcon test-result --verbose'
        if: always()
