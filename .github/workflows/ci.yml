# CI for marine_perception_tools. See ADR-0004/0005 (enforcement hierarchy)
# in the workspace repo for the rationale behind the build+test+lint gate.

name: CI

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ros:jazzy-ros-core

    steps:
      - name: Update apt
        run: apt-get update

      - name: Install ros dev tools
        run: DEBIAN_FRONTEND=noninteractive apt-get -y install ros-dev-tools

      - name: Checkout
        uses: actions/checkout@v6

      - name: Init rosdep
        run: |
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi

      - name: Update rosdep
        run: rosdep update

      - name: Create workspace
        run: mkdir -p ../ws/src && ln -s "$GITHUB_WORKSPACE" ../ws/src/marine_perception_tools

      # sea_surface_segmentation is a source sibling (not in rosdep): the tuner
      # reuses its exported header-only algorithm core. Clone it so the build
      # resolves. This pulls its heavier transitive deps (depthai, nav2, grid_map)
      # via rosdep below — the workspace `make build` is the primary integration
      # gate; this per-repo CI is the lighter-weight check.
      - name: Clone sea_surface_segmentation source dependency
        run: >
          git clone --depth 1 -b jazzy
          https://github.com/rolker/unh_marine_perception.git
          ../ws/src/unh_marine_perception

      # marine_control is a source sibling (not in rosdep): sea_surface_segmentation
      # gained a device-control dependency on it (unh_marine_autonomy#140 / ADR-0003),
      # so its find_package(marine_control) fails without this. The repo also provides
      # marine_control_interfaces (a sea_surface_segmentation test_depend).
      - name: Clone marine_control source dependency
        run: >
          git clone --depth 1 -b jazzy
          https://github.com/rolker/marine_control.git
          ../ws/src/marine_control

      # marine_colormap is a source sibling (not in rosdep): the sidescan viewer
      # uses its shared colormap library/shaders. Clone it so the build resolves.
      - name: Clone marine_colormap source dependency
        run: >
          git clone --depth 1 -b jazzy
          https://github.com/rolker/marine_colormap.git
          ../ws/src/marine_colormap

      # marine_sonar_widgets is a source sibling (not in rosdep): the viewer's
      # shared sonar panes (WaterfallWidget, EchogramWidget) live there. Its own
      # deps resolve via the siblings already cloned (marine_colormap,
      # marine_interfaces) + rosdep (marine_acoustic_msgs, Qt).
      - name: Clone marine_sonar_widgets source dependency
        run: >
          git clone --depth 1 -b jazzy
          https://github.com/rolker/marine_sonar_widgets.git
          ../ws/src/marine_sonar_widgets

      # Several source siblings live inside the unh_marine_autonomy repo, not in
      # rosdep. Clone the repo once and keep only the packages the viewer needs,
      # so CI doesn't pull the heavy transitive deps of the other siblings:
      #   marine_interfaces (Contact.msg) + marine_contacts (Qt-free Contact builder)
      #   marine_autonomy (gggs tile grid) + marine_tiled_raster_store (store tiles)
      #   marine_survey_index (index query lib) and its deps marine_sidescan_mosaic
      #   + marine_backscatter — the survey-overview basemap/pass-list chain.
      #   marine_bathymetry_store + marine_mbes_backscatter_store +
      #   marine_vertical_datum — not used directly by the viewer; they are
      #   cube_bathymetry's own uma dependencies, needed since the CUBE lab
      #   (#27) made cube_bathymetry a dependency of this package.
      - name: Clone unh_marine_autonomy source dependencies
        run: |
          git clone --depth 1 -b jazzy \
            https://github.com/rolker/unh_marine_autonomy.git /tmp/uma
          for pkg in marine_interfaces marine_contacts marine_autonomy \
            marine_tiled_raster_store marine_backscatter marine_sidescan_mosaic \
            marine_survey_index marine_bathymetry_store \
            marine_mbes_backscatter_store marine_vertical_datum; do
            mv "/tmp/uma/$pkg" "../ws/src/$pkg"
          done

      # cube_bathymetry is a source sibling (not in rosdep): the survey
      # explorer's box CUBE lab (#27) runs CUBE in-process, so package.xml
      # declares it and rosdep cannot resolve the key without this clone. Its
      # own uma dependencies are pulled in the step above. The repo root also
      # holds original_cube/, which carries no package.xml and is ignored.
      - name: Clone cube_bathymetry source dependency
        run: >
          git clone --depth 1 -b jazzy
          https://github.com/rolker/cube_bathymetry.git
          ../ws/src/cube_bathymetry

      # geodesy from the released jazzy debian predates the WGS84-geodesics API
      # (geodesy/geodesics.h) that marine_sidescan_mosaic uses; the workspace
      # carries geographic_info (ros2 branch) in underlay_ws for the same
      # reason (see unh_marine_autonomy config/repos/underlay.repos). Cloning
      # it into src makes rosdep skip the debian and colcon build it fresh.
      - name: Clone geographic_info source dependency
        run: >
          git clone --depth 1 -b ros2
          https://github.com/ros-geographic-info/geographic_info.git
          ../ws/src/geographic_info

      - name: Install ROS dependencies
        working-directory: ../ws
        run: >
          DEBIAN_FRONTEND=noninteractive
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/jazzy/setup.bash &&
          colcon build --packages-up-to marine_perception_tools
          --cmake-args -DBUILD_TESTING=ON'

      - name: Test
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/jazzy/setup.bash &&
          source install/setup.bash &&
          colcon test --packages-select marine_perception_tools
          --event-handlers console_direct+
          --return-code-on-test-failure'

      - name: Test results
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/jazzy/setup.bash &&
          colcon test-result --verbose'
        if: always()
